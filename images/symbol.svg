<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 96">

  <!-- 배경 -->
  <rect width="80" height="96" fill="#F5F2EC"/>

  <!-- 외부 프레임 -->
  <rect x="6" y="6" width="68" height="84" fill="none" stroke="#0B1F4A" stroke-width="1.2"/>

  <!-- 상단 디테일 라인 -->
  <line x1="6" y1="24" x2="74" y2="24" stroke="#0B1F4A" stroke-width="0.5" opacity="0.3"/>

  <!-- W 이니셜 (패스로 직접 그리기) -->
  <!-- W: 5개 꼭짓점 -->
  <polyline
    points="22,32 27,52 32,40 37,52 42,32"
    fill="none"
    stroke="#0B1F4A"
    stroke-width="1.4"
    stroke-linejoin="miter"
    stroke-linecap="round"
  />

  <!-- S 이니셜 (패스로 직접 그리기) -->
  <path
    d="M52 38 C52 34 57 32 60 34 C63 36 63 40 60 42 C57 44 52 46 52 50 C52 54 57 56 60 54"
    fill="none"
    stroke="#0B1F4A"
    stroke-width="1.4"
    stroke-linecap="round"
  />

  <!-- 수평선 -->
  <line x1="14" y1="66" x2="66" y2="66" stroke="#0B1F4A" stroke-width="0.4" opacity="0.25"/>

  <!-- 파도 (골든 액센트) -->
  <path
    d="M14 66 Q23 59 32 66 Q41 73 50 66 Q59 59 66 66"
    fill="none"
    stroke="#C9A96E"
    stroke-width="1.3"
    stroke-linecap="round"
  />

  <!-- 하단 짧은 장식선 -->
  <line x1="32" y1="82" x2="48" y2="82" stroke="#0B1F4A" stroke-width="0.5" opacity="0.2"/>

</svg>
